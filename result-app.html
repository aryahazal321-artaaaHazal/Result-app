<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Result Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14123b;
    --ink-2:#1f1b57;
    --violet:#7a5cff;
    --mint:#2de0a7;
    --coral:#ff5d73;
    --gold:#ffc857;
    --paper:#ffffff;
    --text:#1c1a3a;
    --muted:#6b6a8a;
    --line:#e7e5f5;
    --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
    --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--body);
    color:var(--text);
    background:var(--ink);
    background-image:
      radial-gradient(60rem 40rem at 10% -10%, #3a2fa0 0%, transparent 60%),
      radial-gradient(50rem 40rem at 110% 10%, #0f6b63 0%, transparent 55%),
      radial-gradient(40rem 30rem at 50% 120%, #5a1f6e 0%, transparent 60%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    padding:clamp(16px,4vw,48px) 16px 48px;
    overflow-x:hidden;
  }

  /* floating shapes */
  .shape{position:fixed;border-radius:50%;filter:blur(2px);opacity:.35;pointer-events:none;animation:float 12s ease-in-out infinite}
  .s1{width:120px;height:120px;background:var(--violet);top:12%;left:6%}
  .s2{width:70px;height:70px;background:var(--mint);top:70%;left:12%;animation-delay:-4s}
  .s3{width:160px;height:160px;background:#ff7ab8;top:60%;right:5%;animation-delay:-7s;opacity:.22}
  .s4{width:50px;height:50px;background:var(--gold);top:18%;right:12%;animation-delay:-2s}
  @keyframes float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-28px) translateX(14px)}}

  .app{width:100%;max-width:760px;position:relative;z-index:1}

  /* header */
  header{text-align:center;color:#fff;margin-bottom:28px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  .crest{
    width:68px;height:68px;margin:0 auto 16px;border-radius:20px;
    background:linear-gradient(135deg,var(--violet),var(--mint));
    display:grid;place-items:center;
    box-shadow:0 12px 40px rgba(122,92,255,.5);
    animation:bob 4s ease-in-out infinite;
  }
  .crest svg{width:34px;height:34px}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.1rem);letter-spacing:-.02em;line-height:1.05}
  header p{margin-top:10px;color:#cfcdf5;font-size:1.02rem}

  /* search */
  .search{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:22px;padding:10px;
    display:flex;gap:10px;
    animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) both;
    transition:transform .2s, box-shadow .2s;
  }
  .search:focus-within{box-shadow:0 0 0 3px rgba(45,224,167,.45)}
  .search.shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .search input{
    flex:1;min-width:0;background:transparent;border:0;outline:0;
    color:#fff;font:600 1.15rem var(--body);padding:14px 16px;letter-spacing:.02em;
  }
  .search input::placeholder{color:#a7a5d6;font-weight:400}
  .search button{
    border:0;cursor:pointer;border-radius:14px;padding:0 26px;
    font:700 1rem var(--body);color:var(--ink);
    background:linear-gradient(135deg,var(--mint),#7cf2d0);
    transition:transform .15s, box-shadow .2s;
    display:flex;align-items:center;gap:8px;min-height:52px;
  }
  .search button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(45,224,167,.4)}
  .search button:active{transform:translateY(0) scale(.97)}
  .search button:disabled{opacity:.7;cursor:wait;transform:none}
  .spinner{width:18px;height:18px;border:3px solid rgba(20,18,59,.25);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;display:none}
  .loading .spinner{display:block}
  .loading .btn-label{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* message */
  .msg{
    margin-top:18px;padding:14px 18px;border-radius:16px;font-weight:500;
    background:rgba(255,93,115,.14);border:1px solid rgba(255,93,115,.5);color:#ffd0d6;
    display:none;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both;
  }
  .msg.show{display:block}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}

  /* result card */
  .card{
    margin-top:26px;background:var(--paper);border-radius:28px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.4);
    display:none;
  }
  .card.show{display:block;animation:cardIn .8s cubic-bezier(.2,.9,.25,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.96) rotateX(8deg)}to{opacity:1;transform:none}}

  .top{
    padding:28px 28px 24px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(120deg,var(--ink-2),#3b2ea8);
  }
  .top.fail{background:linear-gradient(120deg,#3b1630,#8a2440)}
  .top::after{
    content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);
  }
  .student{position:relative;z-index:1}
  .student h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,5vw,2.2rem);letter-spacing:-.01em;line-height:1.1}
  .student .father{margin-top:6px;color:#d6d3ff;font-size:1rem}
  .chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    padding:7px 14px;border-radius:999px;font-size:.9rem;font-weight:500;
  }
  .chip b{font-weight:700}

  .summary{
    display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;
    padding:28px;border-bottom:1px solid var(--line);
  }
  .ring{position:relative;width:150px;height:150px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:var(--mint);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
  .ring.fail .fg{stroke:var(--coral)}
  .ring .num{
    position:absolute;inset:0;display:grid;place-content:center;text-align:center;
    font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;
  }
  .ring .num small{font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--muted);margin-top:4px}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .stat{background:#f6f5ff;border-radius:16px;padding:14px 16px}
  .stat span{display:block;font-size:.8rem;color:var(--muted);font-weight:500}
  .stat strong{display:block;margin-top:2px;font-family:var(--display);font-size:1.5rem;font-weight:800}
  .stat.status strong.pass{color:#0fa97a}
  .stat.status strong.fail{color:var(--coral)}
  .stat.grade{position:relative}
  .stamp{
    display:inline-block;font-family:var(--display);font-weight:800;font-size:1.5rem;
    transform:scale(0) rotate(-30deg);
  }
  .card.show .stamp{animation:stamp .6s 1.2s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes stamp{to{transform:scale(1) rotate(-6deg)}}
  .stat.rank strong{color:var(--violet)}

  .subjects{padding:26px 28px 8px}
  .subjects h3{font-family:var(--display);font-size:1.15rem;font-weight:700;margin-bottom:16px}
  .sub{margin-bottom:18px}
  .sub .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-weight:500}
  .sub .row b{font-weight:700;font-variant-numeric:tabular-nums}
  .sub .row .low{color:var(--coral)}
  .track{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--mint));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .bar.low{background:linear-gradient(90deg,#ff9a6b,var(--coral))}

  .foot{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    padding:18px 28px 24px;color:var(--muted);font-size:.88rem;
  }
  .foot button{
    border:2px solid var(--line);background:#fff;color:var(--text);cursor:pointer;
    font:700 .92rem var(--body);padding:10px 18px;border-radius:12px;transition:.2s;
  }
  .foot button:hover{border-color:var(--violet);color:var(--violet)}

  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  @media (max-width:560px){
    .summary{grid-template-columns:1fr;justify-items:center;text-align:center}
    .stats{width:100%}
    .search{flex-direction:column}
    .search button{justify-content:center}
    .top,.summary,.subjects,.foot{padding-left:20px;padding-right:20px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
    .stamp{transform:scale(1) rotate(-6deg)}
  }
  @media print{
    body{background:#fff}
    .shape,header,.search,.msg,.foot button{display:none!important}
    .card{box-shadow:none;margin:0}
    .top,.top.fail{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
  <span class="shape s1"></span><span class="shape s2"></span>
  <span class="shape s3"></span><span class="shape s4"></span>

  <main class="app">
    <header>
      <div class="crest" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/>
        </svg>
      </div>
      <h1>Apna Result Dekhein</h1>
      <p>Roll number likhein aur result foran dekhein.</p>
    </header>

    <form class="search" id="form" autocomplete="off">
      <input id="roll" type="text" inputmode="numeric" placeholder="Roll number likhein, jaise 1001" aria-label="Roll number" required>
      <button type="submit" id="btn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">Result dekhein</span>
      </button>
    </form>

    <div class="msg" id="msg" role="alert"></div>

    <section class="card" id="card" aria-live="polite">
      <div class="top" id="top">
        <div class="student">
          <h2 id="name"></h2>
          <div class="father" id="father"></div>
          <div class="chips">
            <span class="chip">Roll No: <b id="rollNo"></b></span>
            <span class="chip" id="srChip">Sr No: <b id="srNo"></b></span>
          </div>
        </div>
      </div>

      <div class="summary">
        <div class="ring" id="ring">
          <svg viewBox="0 0 120 120">
            <circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="10"/>
            <circle class="fg" id="fg" cx="60" cy="60" r="54" fill="none" stroke-width="10"/>
          </svg>
          <div class="num"><span id="pct">0%</span><small>Percentage</small></div>
        </div>
        <div class="stats">
          <div class="stat status"><span>Status</span><strong id="status"></strong></div>
          <div class="stat grade"><span>Grade</span><strong><span class="stamp" id="grade"></span></strong></div>
          <div class="stat"><span>Total marks</span><strong id="total"></strong></div>
          <div class="stat rank"><span>Class position</span><strong id="rank"></strong></div>
        </div>
      </div>

      <div class="subjects">
        <h3>Subject-wise marks</h3>
        <div id="subjects"></div>
      </div>

      <div class="foot">
        <span>Yeh online result sirf maloomat ke liye hai.</span>
        <button type="button" id="print">Result print karein</button>
      </div>
    </section>
  </main>

<script>
  // Aap ka Google Apps Script Web App URL
  const API_URL = "https://script.google.com/macros/s/AKfycbzbyjD7DJaqGZ1Q9hPfafu06c__bqCGNobOZ1YnumiJ0R2x-4sidVr3DPfzXuwtRDh33g/exec";

  // Pass hone ke liye har subject mein kam az kam itne marks
  const PASS_MARK = 33;

  // Yeh columns subject nahi hain, baqi sab columns subject maane jayenge
  const NON_SUBJECT = ["Sr No","Roll No","Name","Father Name","Total","Percentage","Grade","Status","Rank"];

  const $ = id => document.getElementById(id);
  const form = $("form"), rollInput = $("roll"), btn = $("btn"), msg = $("msg"), card = $("card");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function showError(text){
    msg.textContent = text;
    msg.classList.remove("show"); void msg.offsetWidth; msg.classList.add("show");
    card.classList.remove("show");
    const s = document.querySelector(".search");
    s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
  }
  function hideError(){ msg.classList.remove("show"); }

  function countUp(el, to, decimals, suffix){
    if (reduceMotion){ el.textContent = to.toFixed(decimals) + suffix; return; }
    const dur = 1600, start = performance.now();
    function tick(now){
      const t = Math.min((now - start) / dur, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = (to * eased).toFixed(decimals) + suffix;
      if (t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function render(s){
    const pass = String(s["Status"]).trim().toLowerCase() === "pass";
    const pct = parseFloat(s["Percentage"]) || 0;

    $("name").textContent = s["Name"] || "";
    $("father").textContent = s["Father Name"] ? "Wald: " + s["Father Name"] : "";
    $("rollNo").textContent = s["Roll No"];
    $("srNo").textContent = s["Sr No"] !== undefined ? s["Sr No"] : "-";
    $("srChip").style.display = s["Sr No"] === undefined ? "none" : "";

    $("top").classList.toggle("fail", !pass);
    $("ring").classList.toggle("fail", !pass);

    const st = $("status");
    st.textContent = pass ? "Pass" : "Fail";
    st.className = pass ? "pass" : "fail";

    $("grade").textContent = s["Grade"] || "-";
    $("grade").style.color = pass ? "#0fa97a" : "#ff5d73";
    $("rank").textContent = s["Rank"] ? "#" + s["Rank"] : "-";

    // subjects
    const wrap = $("subjects");
    wrap.innerHTML = "";
    const subjects = Object.keys(s).filter(k => !NON_SUBJECT.includes(k));
    subjects.forEach((k, i) => {
      const marks = Number(s[k]) || 0;
      const low = marks < PASS_MARK;
      const box = document.createElement("div"); box.className = "sub";
      const row = document.createElement("div"); row.className = "row";
      const label = document.createElement("span"); label.textContent = k;
      const val = document.createElement("b"); val.textContent = marks + " / 100";
      if (low) val.className = "low";
      row.append(label, val);
      const track = document.createElement("div"); track.className = "track";
      const bar = document.createElement("div"); bar.className = "bar" + (low ? " low" : "");
      track.append(bar); box.append(row, track); wrap.append(box);
      setTimeout(() => { bar.style.width = Math.min(marks, 100) + "%"; }, reduceMotion ? 0 : 500 + i * 140);
    });

    const maxTotal = subjects.length * 100;
    $("total").textContent = (s["Total"] !== undefined ? s["Total"] : "-") + (maxTotal ? " / " + maxTotal : "");

    // ring + percentage
    const C = 339.3, fg = $("fg");
    fg.style.transition = "none"; fg.style.strokeDashoffset = C; void fg.getBoundingClientRect();
    fg.style.transition = "";
    requestAnimationFrame(() => { fg.style.strokeDashoffset = C * (1 - Math.min(pct, 100) / 100); });
    countUp($("pct"), pct, pct % 1 ? 1 : 0, "%");

    card.classList.remove("show"); void card.offsetWidth; card.classList.add("show");
    setTimeout(() => card.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block:"start"}), 150);
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const roll = rollInput.value.trim();
    hideError();
    if (!roll){ showError("Pehle roll number likhein."); return; }

    btn.disabled = true; btn.classList.add("loading");
    try {
      const res = await fetch(API_URL + "?roll=" + encodeURIComponent(roll));
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (data.success) render(data.student);
      else showError(data.message || "Is roll number ka result nahi mila.");
    } catch (err) {
      showError("Result load nahi ho saka. Internet check karein aur dobara koshish karein.");
      console.error(err);
    } finally {
      btn.disabled = false; btn.classList.remove("loading");
    }
  });

  $("print").addEventListener("click", () => window.print());
</script>
</body>
</html>
